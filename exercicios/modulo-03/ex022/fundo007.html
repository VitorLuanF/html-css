<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        body {
            margin: 0px;
            height: 100vh;
        }
        #conteiner {
            background-image: url('imagens/target001.png');
            background-size: 100% 100%;

            position: relative;
            height: 97.9vh;
            background-color: purple;
            padding: 10px;
            margin: 0px;
        }
        #conteudo { 
            background-image: url('imagens/target001.png');
            background-size: 100% 100%;

            width: 400px;
            height: 200px;
            background-color: yellow;

            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            
        }
    </style>
</head>
<body>
    <section id="conteiner">
        <article id="conteudo">

        </article>
    </section>
    
</body>
</html>
